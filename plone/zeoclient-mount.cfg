# One instance with two databases, each a ZEO client of the same
# `zoe serve`. The database `main` is at `/`, and the database `content` is
# at the mount point `/content`. `just plone zeoclient-mount check` starts
# one server with the two named storages `main` and `content`, on the
# stores target/plone/zeoclient-mount/var/main and
# target/plone/zeoclient-mount/var/content, and on the zeo-address of
# zeoclient.cfg.
[buildout]
extends = zeoclient.cfg
scenario = zeoclient-mount

[instance]
zeo-storage = main
# Plone 6.1 does not ship Products.ZODBMountPoint. It adds the mount point
# to the database `main`.
eggs +=
    Products.ZODBMountPoint
# Each ZEO client keeps its own blob cache. The mount point makes the
# folder `content` in the database `content` when the folder is missing.
zope-conf-additional =
    <zodb_db content>
        cache-size 30000
        <zeoclient>
          server ${:zeo-address}
          storage content
          name content
          blob-dir ${buildout:var-directory}/blobcache-content
          shared-blob-dir off
        </zeoclient>
        mount-point /content
        container-class OFS.Folder.Folder
    </zodb_db>

[versions]
# Version 3.0 makes Products a native namespace package. The other Products
# eggs of Plone 6.1 declare Products with pkg_resources, which then does
# not find Products.ZODBMountPoint 3.0. Version 2.0 declares it the same
# way as they do.
Products.ZODBMountPoint = 2.0
