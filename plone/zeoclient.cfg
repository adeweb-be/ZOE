# One instance as a client of `zoe serve`. The server is not a buildout
# part. `just plone zeoclient check` starts it with the `zoe` binary before
# the instance, on the store target/plone/zeoclient/var/zoe and on the
# zeo-address below. The server sends the blobs, and the instance keeps a
# cache of them.
[buildout]
extends = base.cfg
scenario = zeoclient

[instance]
zeo-client = on
zeo-address = 127.0.0.1:8100
blob-storage = ${buildout:var-directory}/blobcache
shared-blob = off
# zoe serve speaks only the msgpack protocol M5 of ZEO. The ZEO client
# needs msgpack for it. Plone pins its version.
eggs +=
    msgpack

# The base storage of the test layers of plone.testing is a ZEO client of
# the `zoe serve` at ZOE_PLONE_ZEO_ADDRESS. `just plone zeoclient suites`
# starts that server and sets the variable. The ZEO client of the layer
# needs ZEO, which zope2instance adds only to the instance.
[test]
eggs +=
    ZEO
    zoedb
initialization =
    import os
    import zoe.plone.testing
    zoe.plone.testing.install(zeo=os.environ["ZOE_PLONE_ZEO_ADDRESS"])
