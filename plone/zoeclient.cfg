# One instance as a client of `zoe serve` through zoe.zeo.ClientStorage,
# the <zoeclient> section of zoedb, with zoedb[plone] in the instance. The
# server is not a buildout part. `just plone zoeclient check` and `just
# plone zoeclient creators` start it with the `zoe` binary before the
# instance, on the address of templates/zoeclient.conf.in. With zope-conf
# set, plone.recipe.zope2instance writes no zope.conf, and it cannot write
# a <zoeclient> section. collective.recipe.template renders the template
# to that path, as in zoe.cfg.
[buildout]
extends = base.cfg
scenario = zoeclient
parts =
    instance
    zope-conf

[instance]
zope-conf = ${buildout:parts-directory}/instance/etc/zope.conf
eggs +=
    zoedb[plone]

[zope-conf]
recipe = collective.recipe.template
input = ${buildout:directory}/templates/zoeclient.conf.in
output = ${instance:zope-conf}
