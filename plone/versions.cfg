# Version pins for the Plone instances: the Plone 6.1 release, plus the few
# packages that the scenarios add.
[buildout]
extends =
    https://dist.plone.org/release/6.1.5/versions.cfg
    https://dist.plone.org/release/6.1.5/versions-extra.cfg

[versions]
collective.recipe.template = 3.0.0
# The wheel that `uv build` produces. The release bumps this pin with the
# crates and the wheel.
zoedb = 0.0.0
