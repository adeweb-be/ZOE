# Settings that every scenario shares. A scenario extends this file, names
# itself in `scenario` and sets the storage of the instance.
[buildout]
extends = versions.cfg
parts = instance
show-picked-versions = true
# The build goes to target/plone. The scenarios share the eggs and the
# downloads. Each scenario has its own scripts, parts and data.
plone-target = ${buildout:directory}/../target/plone
eggs-directory = ${:plone-target}/eggs
download-cache = ${:plone-target}/downloads
bin-directory = ${:plone-target}/${:scenario}/bin
parts-directory = ${:plone-target}/${:scenario}/parts
develop-eggs-directory = ${:plone-target}/${:scenario}/develop-eggs
installed = ${:plone-target}/${:scenario}/.installed.cfg
var-directory = ${:plone-target}/${:scenario}/var

[instance]
recipe = plone.recipe.zope2instance
# The instance listens only on this host. `just plone` gives buildout the
# name of the admin user, with an empty password. set_admin.py gives the
# password in the instance.
http-address = 127.0.0.1:8080
var = ${buildout:var-directory}
eggs =
    Plone
    plone.app.testing
