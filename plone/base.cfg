# Settings that every scenario shares. A scenario extends this file and sets
# the storage of the instance.
[buildout]
extends = versions.cfg
parts = instance
# zoedb comes from the wheel that `uv build` writes to target/wheels.
find-links = ${buildout:directory}/../target/wheels
show-picked-versions = true

[instance]
recipe = plone.recipe.zope2instance
http-address = 8080
eggs =
    Plone
    plone.app.testing
