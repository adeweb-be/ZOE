# Baseline: one instance as a client of a ZEO 6 server.
[buildout]
extends = base.cfg
scenario = zeo
parts =
    zeoserver
    instance

[zeoserver]
recipe = plone.recipe.zeoserver
# The server listens only on this host, and keeps its files in the data of
# the scenario.
zeo-address = 127.0.0.1:8100
var = ${buildout:var-directory}
file-storage = ${buildout:var-directory}/filestorage/Data.fs
blob-storage = ${buildout:var-directory}/blobstorage

[instance]
zeo-client = on
zeo-address = ${zeoserver:zeo-address}
blob-storage = ${buildout:var-directory}/blobcache
shared-blob = off
