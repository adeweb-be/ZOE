# One instance on the in-process ZOE storage. plone.recipe.zope2instance
# cannot write a <zoe> stanza, so collective.recipe.template renders
# zope.conf from templates/zope.conf.in and the instance uses that file.
[buildout]
extends = base.cfg
parts =
    zope-conf
    instance

[zope-conf]
recipe = collective.recipe.template
input = ${buildout:directory}/templates/zope.conf.in
output = ${buildout:parts-directory}/zope-conf/zope.conf

[instance]
zope-conf = ${zope-conf:output}
eggs +=
    zoedb
