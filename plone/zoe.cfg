# One instance on the in-process ZOE storage, with the <zoe> stanza alone.
# plone.recipe.zope2instance cannot write a <zoe> stanza. With zope-conf
# set, it writes no zope.conf. collective.recipe.template then renders
# templates/zope.conf.in to that path, in the instance, where the wsgi.ini
# of the instance reads it.
[buildout]
extends = base.cfg
scenario = zoe
parts =
    instance
    zope-conf

[instance]
zope-conf = ${buildout:parts-directory}/instance/etc/zope.conf
eggs +=
    zoedb

[zope-conf]
recipe = collective.recipe.template
input = ${buildout:directory}/templates/zope.conf.in
output = ${instance:zope-conf}

# The base storage of the test layers of plone.testing is a zoe.Storage in
# a new directory.
[test]
initialization =
    import zoe.plone.testing
    zoe.plone.testing.install()
