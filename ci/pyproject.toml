[project]
name = "ci"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["dagger-io"]

# The tests of the module run with pytest against a Dagger engine.
[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
dagger-io = { path = "sdk", editable = true }

# The module runs on CPython 3.14. ruff then knows tomllib as a module of
# the standard library.
[tool.ruff]
target-version = "py314"
