[package]
name = "zoe-convert"
description = "Converters between Data.fs, RelStorage and ZOE stores."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
blake3.workspace = true
# The JSON of the report of `verify`.
serde_json.workspace = true
thiserror.workspace = true
# The hash that names a key of a namespace in a report, never the key.
xxhash-rust.workspace = true
zoe-core.workspace = true
zoe-pickle.workspace = true

[dev-dependencies]
# The acceptance test of the batched sync counts the syncs of the database
# file through a storage backend of redb.
redb.workspace = true
# The record builders of `zoe_pickle::testing`.
zoe-pickle = { workspace = true, features = ["testing"] }

[lints]
workspace = true
