[package]
name = "zoe-client"
description = "A Rust client for the ZEO protocol, with the ZOE extensions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The anonymous mapping of the client cache.
libc.workspace = true
rmpv.workspace = true
# TLS to the server, with the TLS stack of zoe-server.
rustls.workspace = true
# The system CA certificates, when the client has no `authenticate`.
rustls-native-certs.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls.workspace = true
xxhash-rust.workspace = true
zoe-core.workspace = true
# The persistent ids of a record, for the prefetch of its references.
zoe-pickle.workspace = true
# The bytes and the names of ZEO 6 that the client shares with the server.
zoe-wire.workspace = true

[dev-dependencies]
futures.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
# The records of BTrees of the split merge tests, with `Heap::new_reference`.
zoe-pickle = { workspace = true, features = ["testing"] }
zoe-server = { workspace = true, features = ["serve"] }

[lints]
workspace = true
