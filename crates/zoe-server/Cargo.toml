[package]
name = "zoe-server"
description = "The zoe command: zoe serve, a tokio server that speaks the ZEO 6 msgpack protocol, and the other subcommands."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["serve"]
# The server code and `zoe mcp`. Only this feature may bring in tokio. The
# extension module turns it off, so it never links tokio.
serve = ["dep:tokio", "dep:libc", "dep:tokio-rustls", "dep:rustls", "dep:rmpv", "dep:toml", "dep:zoe-mcp", "dep:tracing", "dep:tracing-subscriber"]
# The module `fuzz`: the entry of the fuzz targets in `fuzz/`.
fuzz = ["serve"]
# The deterministic simulator `zoe_server::sim`. Only the dev-dependency
# below turns it on, so only test builds have it.
sim = ["serve", "dep:redb", "dep:zoe-client"]

[[bin]]
name = "zoe"
path = "src/main.rs"

[[test]]
name = "mcp"
required-features = ["serve"]

[dependencies]
clap.workspace = true
serde_json.workspace = true
zoe-convert.workspace = true
zoe-core.workspace = true
libc = { workspace = true, optional = true }
redb = { workspace = true, optional = true }
rmpv = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt-multi-thread", "net", "io-util", "sync", "signal", "macros"] }
tokio-rustls = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
zoe-client = { workspace = true, optional = true }
zoe-mcp = { workspace = true, optional = true }

[dev-dependencies]
rmpv.workspace = true
serde_json.workspace = true
# This crate with the simulator. Cargo builds dev-dependencies only for
# tests, examples and benchmarks.
zoe-server = { workspace = true, features = ["sim"] }

[lints]
workspace = true
