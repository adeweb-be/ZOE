[package]
name = "zoe-core"
description = "The ZOE storage core: data model, two-phase commit, locks, conflicts, pack and blobs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
blake3.workspace = true
libc.workspace = true
redb.workspace = true
thiserror.workspace = true
tracing.workspace = true
xxhash-rust.workspace = true
zoe-pickle = { path = "../zoe-pickle" }
zstd.workspace = true

[features]
# The test hook `zoe_core::testing`, which rewrites stored bytes. Only the
# dev-dependency below turns it on, so only test builds have it.
testing = []

[dev-dependencies]
# This crate with the test hook. Cargo builds dev-dependencies only for
# tests, examples and benchmarks.
zoe-core = { workspace = true, features = ["testing"] }

[lints]
workspace = true
