[package]
name = "zoe-catalog"
description = "The catalog mirror: ZCatalog indexes in memory, queried as of a tid."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The plan, the reply and the overlay of `catalog_query` as msgpack values,
# for the server and the native client.
# The glob of the compatibility mode whose prefix is a regular expression
# (feature `text`). tantivy already depends on it.
regex = { version = "1", optional = true }
rmpv.workspace = true
roaring.workspace = true
# The settings of the namespace `zoe.text` (feature `text`).
serde_json = { workspace = true, optional = true }
# The text index (feature `text`).
tantivy = { workspace = true, optional = true }
# The log of a damaged delta (feature `text`).
tracing = { workspace = true, optional = true }
# The NFKC of the splitter of the compatibility mode (feature `text`).
unicode-normalization = { version = "0.1", optional = true }
zoe-core.workspace = true
zoe-pickle.workspace = true

[features]
# The module `testing`, which writes the records of a catalog for the tests
# of this crate and of the crates that serve the mirror. Only
# dev-dependencies turn it on.
testing = ["zoe-pickle/testing"]
# The native text index of each registered catalog, on tantivy (ADR 0060).
# A build without it has no text index and links no tantivy.
text = [
    "dep:tantivy",
    "dep:serde_json",
    "dep:tracing",
    "dep:regex",
    "dep:unicode-normalization",
]

[dev-dependencies]
serde_json.workspace = true
# The hooks that damage a delta on purpose.
zoe-core = { workspace = true, features = ["testing"] }
# This crate with the module `testing`. Cargo builds dev-dependencies only
# for tests, examples and benchmarks.
zoe-catalog = { path = ".", features = ["testing", "text"] }

[lints]
workspace = true
