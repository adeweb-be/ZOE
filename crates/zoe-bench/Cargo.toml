[package]
name = "zoe-bench"
description = "A load generator that speaks the ZEO protocol."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
clap.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# The clients and the runtime of `load`, `saturate` and `hot`; `hot` reads
# the metrics of the admin port over a socket.
tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-util"] }
zoe-client.workspace = true
zoe-core.workspace = true

[dev-dependencies]
zoe-server = { workspace = true, features = ["serve"] }

[lints]
workspace = true
