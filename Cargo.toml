[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/adeweb-be/ZOE"
publish = false

[workspace.dependencies]
zoe-core = { path = "crates/zoe-core" }
zoe-pickle = { path = "crates/zoe-pickle" }
blake3 = "1.8"
pyo3 = "0.29"
redb = "4.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zstd = { version = "0.14", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
