[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/adeweb-be/ZOE"
publish = false

[workspace.dependencies]
zoe-core = { path = "crates/zoe-core" }
pyo3 = "0.29"
redb = "4.3"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
