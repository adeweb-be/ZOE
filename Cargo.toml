[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/adeweb-be/ZOE"
publish = false

[workspace.dependencies]
zoe-client = { path = "crates/zoe-client" }
zoe-convert = { path = "crates/zoe-convert" }
zoe-core = { path = "crates/zoe-core" }
zoe-loupe = { path = "crates/zoe-loupe" }
zoe-mcp = { path = "crates/zoe-mcp" }
zoe-pickle = { path = "crates/zoe-pickle" }
# The bytes and the names of ZEO 6 that the server and the clients share.
zoe-wire = { path = "crates/zoe-wire" }
# Without `serve`. A member that serves turns the feature on.
zoe-server = { path = "crates/zoe-server", default-features = false }
blake3 = "1.8"
clap = { version = "4.6", features = ["derive", "env"] }
futures = { version = "0.3.34", default-features = false, features = ["alloc"] }
libc = "0.2"
# The OpenTelemetry traces of `zoe serve`. Only zoe-server uses them.
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["trace", "grpc-tonic", "http-proto", "http-json", "reqwest-blocking-client"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace"] }
pyo3 = "0.29"
redb = "4.3"
rmcp = { version = "3.5.1", default-features = false, features = ["server", "macros", "transport-io"] }
# The msgpack values of the ZEO protocol.
rmpv = "1.3"
# TLS on the ZEO port of `zoe serve`. ring needs only a C compiler, also for
# the static musl binary.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# The system CA certificates of the native client. Only zoe-client uses it.
rustls-native-certs = "0.8.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The handlers of SIGTERM and SIGHUP of the extension module (zoe-py).
signal-hook = { version = "0.4.5", default-features = false, features = ["iterator"] }
thiserror = "2"
# The configuration file of `zoe serve`.
toml = { version = "1.1", default-features = false, features = ["std", "parse", "serde"] }
# Never in zoe-core. zoe-server, zoe-client, zoe-bench, zoe-mcp, Loupe's
# server mode and the native client of the extension module (zoe-py) use it.
# ADR 0035 records the decision for zoe-py.
tokio = { version = "1.53", default-features = false }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
# The log lines of `zoe serve`, as text or as JSON. Only zoe-server uses it.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "std"] }
# The bridge from the spans of `tracing` to OpenTelemetry. Only zoe-server uses it.
tracing-opentelemetry = { version = "0.34.0", default-features = false }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zstd = { version = "0.14", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# With its debug assertions, redb reads every page of the database at each
# open. The tests then start a large store slowly, as no release build does.
[profile.dev.package.redb]
debug-assertions = false
