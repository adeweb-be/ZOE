# The devenv release of the project. The CI containers install the same
# release (ci/src/ci/main.py).
require_version: "2.4.0"
inputs:
  devenv:
    url: github:cachix/devenv/v2.4.0?dir=src/modules
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling
  rust-overlay:
    url: github:oxalica/rust-overlay
    inputs:
      nixpkgs:
        follows: nixpkgs
  dagger:
    url: github:dagger/nix
    inputs:
      nixpkgs:
        follows: nixpkgs
