# Thin workflow: all CI logic lives in the Dagger module in ci/.
# The nightly jobs belong on the self-hosted reference runner. Until that
# runner exists, they run on a hosted runner.
name: nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly:
    runs-on: ubuntu-latest
    # A hung step fails the job after this time.
    timeout-minutes: 240
    env:
      # Nix fetches the github: inputs through the GitHub API with this token.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: free disk
        # The image holds SDKs that CI does not use. Dagger needs the space.
        # The space before and after shows if the step still frees any.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /
      - uses: actions/checkout@v7
      - name: dagger conformance
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.10"
          module: ci
          call: --github-token env:GITHUB_TOKEN conformance
      - name: dagger plone
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.10"
          module: ci
          call: --github-token env:GITHUB_TOKEN plone
      - name: dagger bench
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.10"
          module: ci
          call: --github-token env:GITHUB_TOKEN bench
      - name: dagger crash
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.10"
          module: ci
          call: --github-token env:GITHUB_TOKEN crash
