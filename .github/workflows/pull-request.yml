# Thin workflow: all CI logic lives in the Dagger module in ci/.
name: pull request

on:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    # A hung step fails the job after this time.
    timeout-minutes: 90
    env:
      # Nix fetches the github: inputs through the GitHub API with this token.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: dagger check
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.10"
          module: ci
          call: --github-token env:GITHUB_TOKEN check
      - name: dagger test
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.10"
          module: ci
          call: --github-token env:GITHUB_TOKEN test
      - name: dagger docs
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.10"
          module: ci
          call: --github-token env:GITHUB_TOKEN docs
