# Thin workflow: all CI logic lives in the Dagger module in ci/.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.10"
          module: ci
          call: release
