# Thin workflow: all CI logic lives in the Dagger module in ci/.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Nix fetches the github: inputs through the GitHub API with this token.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: dagger release
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.10"
          module: ci
          call: --github-token env:GITHUB_TOKEN release
