# The code that every benchmark harness of bench/ shares: the start and the
# stop of the servers, the provenance of a result, the bench lock and the
# atomic write of a JSON file. It uses the standard library only, so the
# interpreter of a Plone instance runs it from src/ on its PYTHONPATH. It is
# not a package that the project ships, so it is not a member of the uv
# workspace in python/. Its tests run in the environment of bench/shootout.
[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[project]
name = "zoe-bench-common"
version = "0.0.0"
description = "Starts and stops the servers of the benchmarks, and records the provenance of their results."
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv.build-backend]
module-name = "benchcommon"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["benchcommon"]
