# The zodbshootout harness of the reference baseline. It is not a package
# that the project ships, so it is not a member of the uv workspace in python/.
[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[project]
name = "zoe-shootout"
version = "0.0.0"
description = "Runs zodbshootout against the reference ZODB storages and writes ZOE benchmark results."
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "zodbshootout==0.8.0",
    # pyperf 2.4 and later define a --profile option, and zodbshootout 0.8.0
    # defines one too. argparse then refuses to start.
    "pyperf==2.3.0",
    # zodbshootout imports six but does not declare it.
    "six",
    "ZODB>=6",
    "ZEO>=6",
    "RelStorage>=4.1",
    # The binary wheel needs no libpq headers to install.
    "psycopg2-binary>=2.9",
    "jsonschema>=4",
    # The zoe storage runs in this process. uv builds its extension from
    # python/zoedb with maturin.
    "zoedb",
    # Direct dependencies, so that the sources below select the forks.
    "persistent",
    "zodbpickle",
    "BTrees",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
]

[tool.uv.sources]
# The source is editable, so the harness runs the Python code of the tree.
# The cache keys of python/zoedb make uv build the extension again when the
# Rust code changes. maturin builds it in the release profile.
zoedb = { path = "../../python/zoedb", editable = true }
# The fork of persistent that the workspace in python/ uses.
persistent = { git = "https://github.com/adeweb-be/persistent", rev = "57a8c54959112f49ef563267f0ed2cb96228c21a" }
# The fork of zodbpickle that the workspace in python/ uses.
zodbpickle = { git = "https://github.com/adeweb-be/zodbpickle", rev = "84029ffb1d5e636b2fa20f44c65272832519263f" }
# The fork of BTrees that the workspace in python/ uses.
BTrees = { git = "https://github.com/adeweb-be/BTrees", rev = "5f863e0ea6757b4720e568a4c929321e1b6e8ebc" }

[tool.uv.build-backend]
module-name = "shootout"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The acceptance test is planner output, and the builder does not edit it.
# It sorts shootout with the third-party imports.
"tests/test_baseline.py" = ["I001"]
