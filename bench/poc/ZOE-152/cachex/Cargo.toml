# A workspace of its own: the prototype of the client cache for the spike.
# Not for merge.
[workspace]

[package]
name = "poc-152-cachex"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
name = "cachex"
crate-type = ["rlib", "cdylib"]

[features]
python = ["dep:pyo3"]

[dependencies]
libc = "0.2"
pyo3 = { version = "=0.29.3", optional = true }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zstd = { version = "0.14", default-features = false }

[profile.release]
debug = false
