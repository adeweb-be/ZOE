# The uv workspace of the packages that the project ships.
[project]
name = "zoe-workspace"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "zoedb",
    # Direct dependencies, so that the sources below select the forks.
    "persistent",
    "zodbpickle",
    "BTrees",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ZODB[test]",
    # The tests of the zoe:// URI. zoedb takes it through its uri extra.
    "zodburi>=3",
    # The ZEO client speaks the msgpack protocol M5 of zoe serve.
    "msgpack",
    # The tests of trace_context make spans with the SDK of OpenTelemetry.
    # With its API installed, zoe.zeo declares trace_context.
    "opentelemetry-sdk",
]

[tool.uv]
package = false

[tool.uv.sources]
zoedb = { workspace = true }
# The fork of persistent, at a commit of the branch zoe-043-getstate-race.
# It fixes the instance dict of a deactivated object on Python 3.13 and
# later, which broke the state of objects on 3.14t.
persistent = { git = "https://github.com/adeweb-be/persistent", rev = "57a8c54959112f49ef563267f0ed2cb96228c21a" }
# The fork of zodbpickle, at a commit of the branch zoe-045-free-threading.
# Its C extension declares that it can run without the GIL, so that
# importing ZODB keeps the GIL off on 3.14t. The pickle bytes do not change.
zodbpickle = { git = "https://github.com/adeweb-be/zodbpickle", rev = "84029ffb1d5e636b2fa20f44c65272832519263f" }
# The fork of BTrees, at a commit of the branch zoe-046-free-threading.
# Its C extensions declare that they can run without the GIL, so that a
# ZODB application that uses BTrees keeps the GIL off on 3.14t. The pickled
# states and the conflict-resolution results do not change.
BTrees = { git = "https://github.com/adeweb-be/BTrees", rev = "f7dfacc28befc038263390fa448df0b8e772f2f0" }

[tool.uv.workspace]
members = ["zoedb"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["zoe"]
