# The uv workspace of the packages that the project ships.
[project]
name = "zoe-workspace"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["zoedb"]

[dependency-groups]
dev = [
    "pytest>=9.1",
]

[tool.uv]
package = false

[tool.uv.sources]
zoedb = { workspace = true }

[tool.uv.workspace]
members = ["zoedb"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["zoe"]
