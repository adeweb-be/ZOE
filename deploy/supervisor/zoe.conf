; zoe serve on a host, as a supervisor program.
;
; Install the static zoe binary as /usr/local/bin/zoe, the configuration
; file as /etc/zoe/zoe.toml (deploy/zoe.toml is an example), create the
; user zoe, the directory /var/lib/zoe and the directory /var/log/zoe, both
; owned by zoe. Then copy this file into the include directory of
; supervisord, for example /etc/supervisor/conf.d/, and run
; `supervisorctl update`.
[program:zoe]
command=/usr/local/bin/zoe serve --config /etc/zoe/zoe.toml
user=zoe
directory=/var/lib/zoe
umask=027
autostart=true
; Restart the server when it exits with a code other than 0. A stop on
; SIGTERM exits with 0.
autorestart=unexpected
exitcodes=0
startsecs=1
startretries=3
; On SIGTERM, zoe serve completes the tpc_finish calls that it received,
; aborts the other transactions, closes the stores and exits with 0. The
; stop takes at most shutdown-timeout (30 seconds by default). Give
; supervisor a longer wait. Else it sends SIGKILL before the stores close.
stopsignal=TERM
stopwaitsecs=45
; zoe serve has no child processes.
stopasgroup=false
killasgroup=false
; stdout holds the lines `admin <address>` and `listening <address>`.
; stderr holds the logs.
redirect_stderr=true
stdout_logfile=/var/log/zoe/zoe.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
